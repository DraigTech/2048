name: draig_2048
description: "A 2048 game built with Flutter and Flame."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  auto_route: ^10.2.0
  bloc: ^9.1.0
  cupertino_icons: ^1.0.8
  drift: ^2.29.0
  drift_flutter: ^0.2.7
  equatable: ^2.0.7
  flame: ^1.33.0
  flame_audio: ^2.11.11
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^8.2.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  uuid: ^4.5.1

dev_dependencies:
  auto_route_generator: ^10.2.5
  bloc_test: ^10.0.0
  build_runner: ^2.7.1
  drift_dev: ^2.29.0
  flutter_gen_runner: ^5.12.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.5.0

flutter_launcher_icons:
  android: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#ffd65a"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/

flutter_gen:
  output: lib/core/assets
  line_length: 80

  integrations:
    flutter_svg: true

  assets:
    enabled: true
